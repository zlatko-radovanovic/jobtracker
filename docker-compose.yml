services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobtracker
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Namerno nema "ports": baza je dostupna samo ostalim kontejnerima (ne sudara se sa XAMPP-om na 3306)

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/jobtracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: Sm9iVHJhY2tlclN1cGVyVGFqbmlLbGp1Y0tvamlKZVZpc2VPZDMyQmFqdGE=
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db_data:
