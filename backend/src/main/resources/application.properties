spring.application.name=jobtracker

# ---------- Baza (XAMPP MySQL: korisnik root, bez lozinke) ----------
# createDatabaseIfNotExist=true => baza "jobtracker" se napravi sama pri prvom pokretanju
spring.datasource.url=jdbc:mysql://localhost:3306/jobtracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# update = Hibernate sam pravi/menja tabele prema entitetima (dobro za razvoj, u produkciji se koristi Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Base64 string od najmanje 32 bajta. U produkciji ide iz environment varijable JWT_SECRET!
app.jwt.secret=${JWT_SECRET:Sm9iVHJhY2tlclN1cGVyVGFqbmlLbGp1Y0tvamlKZVZpc2VPZDMyQmFqdGE=}
# 24 sata u milisekundama
app.jwt.expiration-ms=86400000

server.port=8080
