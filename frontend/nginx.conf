server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Zahtevi ka /api idu na backend kontejner (isto kao proxy.conf.json u razvoju)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular rutiranje: svaka nepoznata putanja vraća index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
